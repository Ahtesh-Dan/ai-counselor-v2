name :Devops pipeline
on:
    push:
        branches:
            - main
jobs:
    Build-and-test:
        runs-on:Ubuntu-latest
        steps:
            - name: 1. naya code check karo(check out)
            - uses: actions/checkout@v3
            - name: 2. Docker oven taayar karo (Build image)
            - run: docker build -t ai-counselor-app
            - name: 3. Success message print karo
            - run: echo "Badhai Ho Chief! Aapka Docker App bilkul perfectly ban gaya hai."
