name: DevOps Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Naya Code Check Karo (Checkout)
        uses: actions/checkout@v3

      - name: 2. Docker Oven Tayar Karo (Build Image)
        run: docker build -t ai-counselor-app .

      - name: 3. Success Message Print Karo
        run: echo "Badhai Ho Chief! Aapka Docker App bilkul perfectly ban gaya hai."
