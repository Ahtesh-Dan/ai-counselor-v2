name: DevOps Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    
    permissions:
      contents: 'read'
      id-token: 'write' 
    
    steps:
      - name: 1. Naya Code Check Karo (Checkout)
        uses: actions/checkout@v3

      - name: 2. GCP VIP Pass Se Login Karo (Auth)
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: 3. GCP Connection Check Karo
        run: gcloud projects list

      - name: 4. Docker Oven Tayar Karo (Build Image)
        run: docker build -t ai-counselor-app .